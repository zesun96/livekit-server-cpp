[package]
name = "livekit-server-cpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Rust binding for the LiveKit C++ server SDK public C ABI"
license = "Apache-2.0"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
base64 = "0.22.1"
libloading = "0.8.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

[dev-dependencies]
hmac = "0.12.1"
sha2 = "0.10.9"
